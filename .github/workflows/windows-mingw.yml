name: Windows Build (MinGW)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-mingw:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.9.2 (MinGW)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.2"
          target: "desktop"
          arch: "win64_mingw"
          tools: "tools_mingw1310"
          cache: true
          dir: "${{ github.workspace }}/Qt"

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          $candidates = @(
            Join-Path $env:GITHUB_WORKSPACE "Qt",
            Join-Path $env:RUNNER_TOOL_CACHE "Qt"
          )
          $mingw = $null
          foreach ($root in $candidates) {
            if (-not (Test-Path $root)) { continue }
            $mingw = Get-ChildItem -Path $root -Recurse -Filter "mingw32-make.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($mingw) { break }
          }
          if (-not $mingw) { throw "mingw32-make.exe not found under Qt install roots." }
          Add-Content $env:GITHUB_PATH (Split-Path $mingw.FullName -Parent)

      - name: Sanity check toolchain
        shell: pwsh
        run: |
          where qmake
          qmake -v
          where mingw32-make
          g++ --version

      - name: Configure (qmake)
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          qmake ..\IntanRHX.pro -spec win32-g++ CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release

      - name: Build
        shell: cmd
        run: |
          cd build
          mingw32-make -j %NUMBER_OF_PROCESSORS%

      - name: Deploy (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          # 找 exe（不要写死 build\release\）
          $exe = Get-ChildItem -Path build -Recurse -Filter "IntanRHX.exe" | Select-Object -First 1
          if (-not $exe) { throw "IntanRHX.exe not found under build/. Check qmake output and TARGET name." }

          Copy-Item $exe.FullName dist\IntanRHX.exe -Force

          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          & $windeployqt --release --compiler-runtime --no-translations "dist\IntanRHX.exe"

          # 第三方 DLL：存在才拷，避免路径不对直接失败
          if (Test-Path "libraries\Windows\okFrontPanel.dll") {
            Copy-Item "libraries\Windows\okFrontPanel.dll" "dist\okFrontPanel.dll" -Force
          }

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "IntanRHX-win64-mingw.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntanRHX-win64-mingw
          path: IntanRHX-win64-mingw.zip
