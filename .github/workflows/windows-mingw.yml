name: Windows Build (MinGW)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-mingw:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.9.2 (MinGW)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.2"
          target: "desktop"
          arch: "win64_mingw"
          tools: "tools_mingw1310"
          cache: true
          dir: "${{ github.workspace }}/Qt"

      # 这一步不是必须，但用于快速定位环境是否就绪
      - name: Sanity check toolchain (before PATH fix)
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "QT_INSTALL_DIR=${{ steps.qt.outputs.qt-path }}"
          where qmake || $true
          where mingw32-make || $true
          where g++ || $true

      # 如果 install-qt-action 没把 mingw 工具链放进 PATH，这里兜底补上
      - name: Ensure MinGW in PATH (fallback)
        shell: pwsh
        run: |
          # 如果已经能找到 mingw32-make，就不做任何事
          if (Get-Command mingw32-make -ErrorAction SilentlyContinue) {
            Write-Host "mingw32-make already in PATH."
            exit 0
          }

          # 尝试从常见目录搜索 mingw32-make.exe
          $roots = @()

          if ($env:QT_ROOT_DIR) {
            $roots += (Split-Path -Parent $env:QT_ROOT_DIR)    # ...\Qt\6.9.2\mingw_64 -> ...\Qt\6.9.2
            $roots += (Split-Path -Parent (Split-Path -Parent $env:QT_ROOT_DIR)) # ...\Qt
          }

          $roots += (Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "Qt")
          if ($env:RUNNER_TOOL_CACHE) {
            $roots += (Join-Path -Path $env:RUNNER_TOOL_CACHE -ChildPath "Qt")
          }

          $roots = $roots | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          Write-Host "Search roots:"
          $roots | ForEach-Object { Write-Host "  - $_" }

          $mingwMake = $null
          foreach ($r in $roots) {
            $mingwMake = Get-ChildItem -Path $r -Recurse -Filter "mingw32-make.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($mingwMake) { break }
          }

          if (-not $mingwMake) {
            throw "mingw32-make.exe not found. Check Qt tools installation (tools_mingw1310)."
          }

          $mingwBin = Split-Path $mingwMake.FullName -Parent
          Write-Host "Found mingw32-make at: $($mingwMake.FullName)"
          Write-Host "Adding to PATH: $mingwBin"
          Add-Content $env:GITHUB_PATH $mingwBin

      - name: Sanity check toolchain (after PATH fix)
        shell: pwsh
        run: |
          where qmake
          qmake -v
          where mingw32-make
          where g++
          g++ --version

      - name: Configure (qmake)
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          qmake ..\IntanRHX.pro -spec win32-g++ CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release

      - name: Build
        shell: cmd
        run: |
          cd build
          mingw32-make -j %NUMBER_OF_PROCESSORS%

      - name: Deploy (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          # 找到 exe（不要写死 build\release\）
          $exe = Get-ChildItem -Path build -Recurse -Filter "IntanRHX.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            throw "IntanRHX.exe not found under build/. Check qmake TARGET / DESTDIR / build output."
          }

          Copy-Item $exe.FullName dist\IntanRHX.exe -Force

          # 使用 Qt 自带的 windeployqt
          if (-not $env:QT_ROOT_DIR) { throw "QT_ROOT_DIR not set. Qt install step may have failed." }
          $windeployqt = Join-Path -Path $env:QT_ROOT_DIR -ChildPath "bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) { throw "windeployqt not found at $windeployqt" }

          & $windeployqt --release --no-translations "dist\IntanRHX.exe"

          # 第三方 DLL（存在才拷贝）
          if (Test-Path "libraries\Windows\okFrontPanel.dll") {
            Copy-Item "libraries\Windows\okFrontPanel.dll" "dist\okFrontPanel.dll" -Force
          }

          # MinGW runtime DLL 兜底（有些情况下 windeployqt 不会自动带齐）
          $mingwBin = (Get-Command g++).Path | Split-Path -Parent
          $dlls = @("libgcc_s_seh-1.dll","libstdc++-6.dll","libwinpthread-1.dll","libssp-0.dll")
          foreach ($dll in $dlls) {
            $dst = Join-Path -Path "dist" -ChildPath $dll
            if (-not (Test-Path $dst)) {
              $src = Join-Path -Path $mingwBin -ChildPath $dll
              if (Test-Path $src) { Copy-Item $src $dst -Force }
            }
          }

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "IntanRHX-win64-mingw.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntanRHX-win64-mingw
          path: IntanRHX-win64-mingw.zip
